<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مبروك النجاح - القطوع المخروطية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0a1620;
    --panel:#0f2436;
    --panel-2:#122c42;
    --gold:#c9a227;
    --gold-light:#e8c96a;
    --cream:#ece5d6;
    --muted:#8ea3b8;
    --maroon:#7a2740;
    --wa-bubble:#e8f8d8;
    --wa-bubble-dark:#dcf3c6;
    --wa-green:#3fae5c;
    --wa-bar:#9fc98a;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, #12314a 0%, transparent 60%),
      var(--navy);
    color:var(--cream);
    font-family:"Cairo","Tajawal",sans-serif;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
    min-height:100%;
  }
  @media (prefers-color-scheme:light){
    :root:not([data-theme="dark"]){ }
  }

  .bg-lines{
    position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.35;
    background-image:
      linear-gradient(rgba(201,162,39,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(201,162,39,.06) 1px, transparent 1px);
    background-size:44px 44px;
    mask-image: radial-gradient(ellipse 100% 70% at 50% 0%, black 30%, transparent 85%);
  }

  .wrap{
    position:relative; z-index:1;
    width:100%; max-width:520px;
    padding:40px 22px 56px;
    display:flex; flex-direction:column; align-items:center;
    text-align:center;
  }

  /* ---------- Hero: animated cone & conic curves ---------- */
  .stage{
    width:100%; max-width:300px; aspect-ratio:1/1; margin:6px auto 8px;
    opacity:0; transform:translateY(14px) scale(.96);
    animation: rise .9s cubic-bezier(.2,.8,.2,1) .15s forwards;
  }
  @keyframes rise{ to{ opacity:1; transform:translateY(0) scale(1); } }

  .stage svg{ width:100%; height:100%; overflow:visible; }
  .cone-line{ fill:none; stroke:var(--gold); stroke-width:1.1; opacity:.8; }
  .cone-fill{ fill:url(#coneGrad); opacity:.5; }
  .plane{
    stroke:var(--gold-light); stroke-width:1.6; fill:rgba(232,201,106,.08);
    transform-origin:150px 150px;
    animation: sweep 7s ease-in-out infinite;
  }
  @keyframes sweep{
    0%,100%{ transform: rotate(-3deg) translateY(-6px); }
    50%{ transform: rotate(4deg) translateY(48px); }
  }

  .curve{ fill:none; stroke-width:3.4; stroke-linecap:round; opacity:0; }
  .curve-label{
    font-family:"Amiri",serif; font-size:15px; fill:var(--muted); opacity:0;
  }
  .c1{ animation: showCurve 8s linear infinite; }
  .c2{ animation: showCurve 8s linear infinite 2s; }
  .c3{ animation: showCurve 8s linear infinite 4s; }
  .c4{ animation: showCurve 8s linear infinite 6s; }
  .c1,.c2,.c3,.c4{ stroke:var(--gold); }
  @keyframes showCurve{
    0%{ opacity:0; }
    4%{ opacity:1; }
    20%{ opacity:1; }
    26%{ opacity:0; }
    100%{ opacity:0; }
  }

  /* ---------- Headline ---------- */
  .eyebrow{
    font-family:"Amiri",serif; color:var(--gold-light); font-size:15px;
    margin:0 0 6px; opacity:0; animation: fadeIn .8s ease .5s forwards;
  }
  h1{
    font-family:"Amiri",serif; font-weight:700; font-size:clamp(30px,8vw,42px);
    line-height:1.25; margin:0 0 14px; color:var(--cream);
    opacity:0; animation: fadeIn .8s ease .65s forwards;
  }
  h1 span{ color:var(--gold); }
  .sub{
    font-size:16px; line-height:1.9; color:var(--muted); max-width:420px;
    margin:0 auto 30px;
    opacity:0; animation: fadeIn .8s ease .8s forwards;
  }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- Divider ---------- */
  .divider{
    width:100%; max-width:340px; height:1px; margin:6px auto 30px;
    background:linear-gradient(90deg, transparent, rgba(201,162,39,.5), transparent);
    opacity:0; animation: fadeIn .8s ease .9s forwards;
  }

  /* ---------- Voice message card ---------- */
  .voice-block{
    width:100%; opacity:0; animation: fadeIn .8s ease 1.05s forwards;
  }
  .voice-label{
    font-family:"Amiri",serif; font-size:20px; color:var(--gold-light);
    margin:0 0 14px; letter-spacing:.3px;
  }
  .wa-bubble{
    display:flex; align-items:center; gap:10px;
    background:var(--wa-bubble);
    border-radius:18px 18px 4px 18px;
    padding:9px 12px 9px 9px;
    max-width:360px; margin:0 auto;
    box-shadow:0 8px 22px rgba(0,0,0,.35);
    position:relative;
  }
  .wa-avatar{
    width:38px; height:38px; border-radius:50%; flex:none;
    background:linear-gradient(145deg,#0f2436,#1b3a5c);
    display:flex; align-items:center; justify-content:center;
    font-size:17px; border:2px solid #fff;
  }
  .wa-play{
    width:38px; height:38px; border-radius:50%; flex:none; border:none;
    background:var(--wa-green); color:#fff; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,.25);
    transition:transform .15s ease;
  }
  .wa-play:active{ transform:scale(.92); }
  .wa-play svg{ width:16px; height:16px; }
  .wa-mid{ flex:1; min-width:0; }
  .wa-wave{
    display:flex; align-items:center; gap:2px; height:26px; cursor:pointer;
  }
  .wa-wave span{
    flex:1; min-width:2px; max-width:3px; border-radius:2px;
    background:var(--wa-bar); transition:background .15s ease;
  }
  .wa-wave span.played{ background:var(--wa-green); }
  .wa-meta{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:3px; font-size:11.5px; color:#5c7a52; direction:ltr;
  }
  .wa-time{ font-variant-numeric:tabular-nums; }
  .wa-mic{ color:var(--wa-green); display:flex; align-items:center; gap:3px; }
  .wa-mic svg{ width:12px; height:12px; }

  /* ---------- Footer ---------- */
  .footer{
    margin-top:44px; font-size:13px; color:var(--muted);
    opacity:0; animation: fadeIn .8s ease 1.2s forwards;
  }
  .footer .school{ color:var(--gold-light); font-family:"Amiri",serif; font-size:15px; margin-bottom:4px; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; }
    .wrap *{ opacity:1 !important; transform:none !important; }
  }
</style>
</head>
<body>
<div class="bg-lines"></div>
<div class="wrap">

  <div class="stage">
    <svg viewBox="0 0 300 300">
      <defs>
        <linearGradient id="coneGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#c9a227" stop-opacity=".5"/>
          <stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
        </linearGradient>
      </defs>

      <!-- double cone -->
      <path class="cone-fill" d="M150,40 L60,190 A90,22 0 0,0 240,190 Z"/>
      <path class="cone-line" d="M150,40 L60,190 A90,22 0 0,0 240,190 Z"/>
      <path class="cone-line" d="M60,190 A90,22 0 0,0 240,190"/>
      <path class="cone-line" d="M150,40 L98,258"/>
      <path class="cone-line" d="M150,40 L202,258"/>
      <ellipse class="cone-line" cx="150" cy="258" rx="52" ry="13"/>

      <!-- sweeping plane -->
      <ellipse class="plane" cx="150" cy="150" rx="72" ry="17"/>

      <!-- cycling conic curves, drawn near the base -->
      <ellipse class="curve c1" cx="150" cy="253" rx="46" ry="11"/>
      <text class="curve-label c1" x="150" y="286" text-anchor="middle">قطع ناقص</text>

      <path class="curve c2" d="M104,272 Q150,196 196,272"/>
      <text class="curve-label c2" x="150" y="292" text-anchor="middle">قطع مكافئ</text>

      <path class="curve c3" d="M110,220 Q150,270 110,296 M190,220 Q150,270 190,296"/>
      <text class="curve-label c3" x="150" y="312" text-anchor="middle">قطع زائد</text>

      <circle class="curve c4" cx="150" cy="253" r="30"/>
      <text class="curve-label c4" x="150" y="292" text-anchor="middle">دائرة</text>
    </svg>
  </div>

  <p class="eyebrow">نهاية الفصل الثاني</p>
  <h1>الفصل قد انتهى<br><span>ومفاجأة تنتظركم 🎉</span></h1>
  <p class="sub">
    كل قطع مخروطي يبدأ من زاوية نظر مختلفة لنفس المخروط —
    وأنتم اليوم وصلتوا لزاوية جديدة من عندكم.
    مبروك إنهاء الفصل، وهذي رسالة صوتية صغيرة إلكم.
  </p>

  <div class="divider"></div>

  <div class="voice-block">
    <p class="voice-label">شعبة الجواهري</p>

    <div class="wa-bubble">
      <button class="wa-play" id="playBtn" aria-label="تشغيل">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <div class="wa-mid">
        <div class="wa-wave" id="wave"></div>
        <div class="wa-meta">
          <span class="wa-mic">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
          </span>
          <span class="wa-time" id="timeLabel">00:00</span>
        </div>
      </div>
      <div class="wa-avatar">📐</div>
    </div>
  </div>

  <div class="footer">
    <div class="school">مدرسة صناع الأوائل</div>
    <div>القطوع المخروطية · شعبة الجواهري</div>
  </div>

</div>
